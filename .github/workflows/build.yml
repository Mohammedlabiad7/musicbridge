name: Build MusicBridge APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install SDK
    run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

  - name: Build QQ flavor
    run: chmod +x gradlew && ./gradlew assembleAsQQRelease

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MusicBridge-asQQ
      path: app/build/outputs/apk/asQQ/release/*.apk