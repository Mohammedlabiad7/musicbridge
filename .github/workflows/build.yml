name: Build MusicBridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleAsQQRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicBridge-APK
          path: app/build/outputs/apk/asQQ/release/*.apk